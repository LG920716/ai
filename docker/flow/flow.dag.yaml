id: template_chat_flow
name: Template Chat Flow
environment:
  python_requirements_txt: requirements.txt
inputs:
  title:
    type: string
    default: 【WILITA 威力特】潤王1300滲透潤滑鬆脫劑300ml(便攜折疊瓶2入)
  tokens_per_message:
    type: int
    default: 2
  tokens_per_name:
    type: int
    default: 1
  chat_history:
    type: list
    default: []
  img_url:
    type: string
    default: https://og.momoshop.com.tw/goodsimg/0011/607/335/11607335_B.jpg
outputs:
  answer:
    type: string
    reference: ${generate_response.output}
nodes:
- name: title
  type: llm
  source:
    type: code
    path: title.jinja2
  inputs:
    temperature: 0
    model: gpt-4o
    deployment_name: gpt-4o-2
    max_tokens: 4096
    title: ${inputs.title}
  connection: momo
  api: chat
- name: image
  type: custom_llm
  source:
    type: package_with_prompt
    tool: promptflow.tools.llm.llm
    path: image.jinja2
  inputs:
    connection: momo
    api: chat
    temperature: 0
    image_input: ${preprocess_image.output}
    context: ${context.output}
    deployment_name: gpt-4o-2
    max_tokens: 4096
  activate:
    when: ${preprocess_image.output.has_image}
    is: true
- name: title_categroy
  type: custom_llm
  source:
    type: package_with_prompt
    tool: promptflow.tools.llm.llm
    path: title_categroy.jinja2
  inputs:
    connection: momo
    api: chat
    context: ${context.output}
    title: ${inputs.title}
    temperature: 0
    deployment_name: gpt-4o-2
    max_tokens: 4096
  activate:
    when: ${title.output}
    is: Y
- name: preprocess_image
  type: python
  source:
    type: code
    path: preprocess_image.py
  inputs:
    url: ${inputs.img_url}
  activate:
    when: ${title.output}
    is: N
- name: no_image
  type: python
  source:
    type: code
    path: no_image.py
  inputs: {}
  activate:
    when: ${preprocess_image.output.has_image}
    is: false
- name: context
  type: python
  source:
    type: code
    path: context.py
  inputs: {}
- name: generate_response
  type: python
  source:
    type: code
    path: generate_response.py
  inputs:
    no_image: ${no_image.output}
    image: ${image.output}
    title: ${title.output}
    title_category: ${title_categroy.output}
