id: template_chat_flow
name: Template Chat Flow
environment:
  python_requirements_txt: requirements.txt
inputs:
  question:
    type: string
    is_chat_input: true
    default: hello
    is_chat_history: false
  tokens_per_message:
    type: int
    default: 2
    is_chat_history: false
  tokens_per_name:
    type: int
    default: 1
    is_chat_history: false
  chat_history:
    type: list
    default: []
    is_chat_history: true
  img_url:
    type: string
    default: ""
outputs:
  answer:
    type: string
    reference: ${generate_response.output}
    is_chat_output: true
nodes:
- name: title
  type: llm
  source:
    type: code
    path: chat.jinja2
  inputs:
    temperature: 0.95
    model: gpt-4o
    deployment_name: gpt-4o-2
    max_tokens: 4096
    context: ${context.output}
    question: ${inputs.question}
  connection: momo
  api: chat
- name: image
  type: prompt
  source:
    type: code
    path: image.jinja2
  inputs: {}
  activate:
    when: ${preprocess_image.output.has_image}
    is: "True"
- name: title_categroy
  type: prompt
  source:
    type: code
    path: title_categroy.jinja2
  inputs:
    context: ${context.output}
    question: ${inputs.question}
  activate:
    when: ${title.output}
    is: Y
- name: preprocess_image
  type: python
  source:
    type: code
    path: preprocess_image.py
  inputs:
    image_url: ${inputs.img_url}
  activate:
    when: ${title.output}
    is: N
- name: no_image
  type: python
  source:
    type: code
    path: no_image.py
  inputs: {}
  activate:
    when: ${preprocess_image.output.has_image}
    is: "False"
- name: context
  type: python
  source:
    type: code
    path: context.py
  inputs: {}
- name: generate_response
  type: python
  source:
    type: code
    path: generate_response.py
  inputs:
    no_image: ${no_image.output}
    title_categroy: ${title_categroy.output}
    image: ${image.output}
